[project]
name = "pdf2video"
version = "0.1.0"
description = "Turn PDF, DOCX, EPUB and text documents into MP3 audiobooks and narrated explanatory videos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygobject>=3.52",
    "pymupdf>=1.26",
    "python-docx>=1.2",
    "ebooklib>=0.19",
    "beautifulsoup4>=4.13",
    "lxml>=6.0",
    "edge-tts>=7.2",
    "pillow>=11.3",
    "pydantic>=2.11",
    "llama-cpp-python>=0.3",
    "httpx>=0.28",
    "piper-tts>=1.8",
    "stable-diffusion-cpp-python>=0.4",
]

[project.scripts]
pdf2video = "pdf2video.__main__:main"
pdf2video-cli = "pdf2video.__main__:cli"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2video"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
